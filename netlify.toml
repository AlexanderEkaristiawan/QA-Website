[build]
  base = "frontend"
  command = "chmod -R +x node_modules/.bin 2>/dev/null || true; npm run build"
  publish = "dist"
  functions = "../netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "../netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm --prefix frontend run dev"
  port = 8888
  targetPort = 5175
  autoLaunch = false
